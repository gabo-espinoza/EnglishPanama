# English Panama - cabeceras de seguridad para el cliente (SPA) servido por nginx.
#
# Cierra D-012 a D-016 del analisis dinamico: el HTML del cliente salia de nginx SIN
# Content-Security-Policy, X-Frame-Options, X-Content-Type-Options ni Permissions-Policy
# (solo la API recibe cabeceras, via helmet). Guia de instalacion: docs/migraciones-produccion.md,
# seccion 17.
#
# COMO USARLO
#   1) Copiar este archivo a /etc/nginx/snippets/englishpanama-cabeceras-seguridad.conf
#   2) En el bloque `server` del sitio (/etc/nginx/sites-available/<sitio>), dentro de
#      CADA `location` que sirva archivos del cliente (normalmente `location /`), agregar:
#
#          include snippets/englishpanama-cabeceras-seguridad.conf;
#
#   3) sudo nginx -t && sudo systemctl reload nginx
#
# NO incluirlo en `location /api/`: la API ya envia sus propias cabeceras con helmet y
# duplicarlas solo ensucia la respuesta.
#
# AVISO (comportamiento de nginx): `add_header` NO se hereda hacia un `location` que defina
# alguno propio. Si algun `location` del cliente (por ejemplo uno de cache para .js/.css) tiene
# su propio `add_header`, hay que repetir el `include` ahi, o esas respuestas saldran sin estas
# cabeceras. `always` hace que tambien salgan en los 4xx y 5xx.
#
# Content-Security-Policy, directiva por directiva (el cliente es una SPA de React):
#   default-src 'self'      lo que no se menciona solo puede venir del propio sitio
#   script-src 'self'       el build de Vite no tiene scripts en linea: index.html solo carga
#                           /assets/index-<hash>.js con <script type="module" src=...>
#   style-src ...           'unsafe-inline' hace falta por los atributos style="" de React y
#                           porque Vite puede insertar <style> en linea; fonts.googleapis.com
#                           por las dos hojas de Google Fonts de client/index.html
#   font-src ...            fonts.gstatic.com (los archivos de las fuentes) y data: (fuentes
#                           en linea)
#   img-src 'self' data:    imagenes propias y data: URI
#   connect-src 'self'      fetch a /api (mismo origen: nginx hace el proxy)
#   frame-ancestors 'none'  nadie puede incrustar el sitio en un iframe (anti-clickjacking)
#   base-uri 'self'         impide cambiar la URL base con una etiqueta <base> inyectada
#   form-action 'self'      los formularios solo se envian al propio sitio
#   object-src 'none'       sin plugins (<object>, <embed>)
#
# No se incluye `upgrade-insecure-requests` ni Strict-Transport-Security: el sitio solo
# escucha en HTTP (puerto 80). Se agregan junto con HTTPS (D-011).
# No se incluyen COEP ni CORP: COEP rompe las fuentes de Google y no aporta a una SPA sin
# datos compartidos entre origenes.
# Cross-Origin-Opener-Policy: los navegadores la ignoran en HTTP sin cifrar (origen no
# confiable) y avisan en la consola; empieza a surtir efecto cuando el sitio use HTTPS.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
